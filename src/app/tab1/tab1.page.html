
<ion-header>
  <ion-toolbar>
    <ion-title>Počasí</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="search-container">

    <ion-item>
      <ion-input
        placeholder="Vyhledat město..."
        #cityInput
        (keyup.enter)="changeCity(cityInput.value?.toString() ?? '')">
      </ion-input>

      <ion-button
        slot="end"
        fill="clear"
        aria-label="Vyhledat město"
        (click)="changeCity(cityInput.value?.toString() ?? '')">

        <ion-icon slot="icon-only" name="search-outline" />

      </ion-button>
    </ion-item>

    <ion-button
      fill="clear"
      aria-label="Použít aktuální polohu"
      (click)="loadWeatherByCurrentLocation()">

      <ion-icon slot="icon-only" name="locate-outline" />

    </ion-button>

  </div>

  @if (weather$ | async; as weather) {

    <div class="city-header">
      <h1>{{ selectedCity }}</h1>

      <app-city
        [cityName]="selectedCity"
        (addFavorite)="addFavoriteCity($event)"
      />
    </div>

    <app-weather-detail [weather]="weather" />

  } @else {

    <ion-spinner></ion-spinner>
    <p>Načítám počasí...</p>

  }

</ion-content>
